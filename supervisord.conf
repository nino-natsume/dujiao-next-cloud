# =============================================================================
# supervisor 配置：容器内同时托管 redis-server 和 dujiao-next 两个进程
# nodaemon=true：前台运行，否则 Render 认为容器已退出、实例睡眠
# 所有日志输出到 /dev/stdout：让 Render 控制台能看到 dujiao 的真实报错
# =============================================================================
[supervisord]
nodaemon=true
logfile=/dev/stdout
pidfile=/tmp/supervisord.pid

# --- Redis（仅本机回环，不对外；重启丢数据没关系）---
[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379 --appendonly no
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stdout

# --- Dujiao-Next 主程序 ---
[program:dujiao]
command=/app/dujiao-next
directory=/app
autorestart=true
stopwaitsecs=10
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stdout
