# =============================================================================
# supervisor 配置：容器内同时托管 redis-server 和 dujiao-next 两个进程
# nodaemon=true：前台运行，否则 Render 认为容器已退出、实例睡眠
# =============================================================================
[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

# --- Redis（仅本机回环，不对外；重启丢数据没关系）---
[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379 --appendonly no
autorestart=true
stdout_logfile=/tmp/redis.log
stderr_logfile=/tmp/redis.log

# --- Dujiao-Next 主程序 ---
[program:dujiao]
command=/app/dujiao-next
directory=/app
autorestart=true
stopwaitsecs=10
stdout_logfile=/tmp/dujiao.log
stderr_logfile=/tmp/dujiao.log