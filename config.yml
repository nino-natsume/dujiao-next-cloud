# =============================================================================
# Dujiao-Next 完整配置文件（v1.4.x）· 教程模板版
#
# ⚠️ 本文件为【教程示例】，所有 <尖括号> 内容都是占位符，
#    部署时必须替换成你自己的真实值，且【严禁】把真实文件提交到公开仓库！
#
# 必改占位符一览（全文搜 < 找）：
#   <APP_SECRET_KEY> / <JWT_SECRET> / <USER_JWT_SECRET>   -> 三个随机密钥（互不相同）
#   <SUPABASE_PROJECT_REF> / <SUPABASE_DB_PASSWORD> / <SUPABASE_REGION>
#   <ADMIN_USERNAME> / <ADMIN_PASSWORD>
#   <RESEND_API_KEY> / <YOUR_DOMAIN>
#   <ADMIN_PATH>（自定义后台路径，务必改！）
# =============================================================================

app:
  # 应用级密钥：订单/用户数据的加解密。泄了=数据裸奔，丢了=数据没法恢复。
  secret_key: "<APP_SECRET_KEY>"

server:
  host: "0.0.0.0"
  port: 8080
  mode: "release"            # release / debug；调试才用 debug
  trusted_proxies: []        # 托管平台代理 IP 未知先留空；极限流可查托管平台官方网段补
  health_check: true         # 开启 /health，UptimeRobot 保活要打它

database:
  # postgres 必须走 Supabase 【Session pooler 5432】！
  # 别用 6543 事务池：不支持 prepared statement，dujiao-next 会连上后报错。
  # 也别用 db.xxx.supabase.co 直连：免费档是 IPv6-only，托管平台往往只有 IPv4。
  driver: "postgres"
  dsn: "postgresql://postgres.<SUPABASE_PROJECT_REF>:<SUPABASE_DB_PASSWORD>@aws-0-<SUPABASE_REGION>.pooler.supabase.com:5432/postgres?sslmode=require"
  pool:
    max_open_conns: 1        # 免费档连接有限，别开大
    max_idle_conns: 1
    conn_max_lifetime_seconds: 0
    conn_max_idle_time_seconds: 0

jwt:
  # 店主后台 JWT 签名密钥（与下方 user_jwt 必须不同！）
  secret: "<JWT_SECRET>"
  exp_hours: 72              # 后台登录有效期（小时）
  iss: "dujiao"
  aud: "dujiao"

user_jwt:
  # 顾客商城 JWT 签名密钥（必须与 jwt.secret 不同！）
  secret: "<USER_JWT_SECRET>"
  exp_days: 30               # 顾客登录有效期（天）
  iss: "dujiao"
  aud: "dujiao-user"

bootstrap:
  enabled: true              # 首次启动用默认管理员；登录后立刻改密码
  default_admin_username: "<ADMIN_USERNAME>"
  default_admin_password: "<ADMIN_PASSWORD>"

email:
  enabled: true
  host: "smtp.xxx.com"
  port: 465                  # 465 = 隐式 SSL，必须用 use_ssl
  username: "xxx"
  password: "<xxx_API_KEY>"       # xxx.com → API Keys → 创建
  from: "<发件邮箱>@<YOUR_DOMAIN>"     # 发件邮箱（与 from_name 分开填写）
  from_name: "你的站点名"            # 发件人显示名称
  use_ssl: true              # 465 用 SSL（与 use_tls 只能开一个）
  use_tls: false             # 必须 false，否则 465 上 STARTTLS 握手失败

redis:
  # 容器内由 entrypoint.sh 启动的 redis-server（127.0.0.1 回环）
  enabled: true
  host: "127.0.0.1"
  port: 6379
  password: ""
  db: 0

queue:
  # 异步队列，用同一个 redis，指定不同 db
  enabled: true
  host: "127.0.0.1"
  port: 6379
  password: ""
  db: 1

log:
  path: "logs"               # 相对 /app 的日志目录，免费层重启会清
  level: "info"              # debug / info / warn / error

upload:
  max_size: 10485760         # 上传大小上限（字节）= 10MB

web:
  # 后台路径必改：/admin 会被扫描器疯狂爆破
  admin_path: "/<ADMIN_PATH>"
  title: "Dujiao"
  subtitle: "数字商品自动交易平台"
  # 首页轮播：商品图建议用外链图床（容器盘重启即丢）
  carousel: []
  footer: ""